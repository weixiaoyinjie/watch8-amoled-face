      - name: Check XML and build APK
        shell: bash
        run: |
          python3 - <<'PYXML'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          p=Path('app/src/main/res/raw/watchface.xml')
          root=ET.parse(p).getroot()
          assert root.tag == 'WatchFace'
          assert len(root.findall('.//ComplicationSlot')) == 8
          ET.parse('app/src/main/AndroidManifest.xml')
          PYXML
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-AMOLED-ShortcutFace-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
