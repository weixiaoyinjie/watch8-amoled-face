name: Build Galaxy Watch8 APK (single file)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Restore watchface source (embedded in this workflow)
