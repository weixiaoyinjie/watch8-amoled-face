name: Build Galaxy Watch8 V3 - Chinese Weekdays

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore Watch8 V3 source (fixed, no heredoc)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | tar -xz
          test -s app/src/main/res/raw/watchface.xml
          echo 'Source extracted successfully'
      - name: Verify XML and build APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import xml.etree.ElementTree as E; from pathlib import Path; p=Path("app/src/main/res/raw/watchface.xml"); t=p.read_text(); r=E.fromstring(t); assert len(r.findall(".//ComplicationSlot"))==8; assert "[BATTERY_PERCENT]" in t; assert "[DAY_OF_WEEK_S]" in t and "zh-CN" in t; E.parse("app/src/main/AndroidManifest.xml"); print("Watch8 V3 layout, battery and Chinese weekday: OK")'
          gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload Watch8 V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-AMOLED-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
